<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plates">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Plates & Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone logbook, bottom tab bar; workouts coded by bumper-plate colors */
:root {
  --bg: #eef0f3; --surface: #ffffff; --ink: #14171c; --muted: #5b6370; --line: #dde1e7; --soft: #f5f6f8;
  --red: #c8342a; --blue: #2459c4; --yellow: #c99500; --green: #27864a;
  --good: #1f7a46; --warn: #a86400; --bad: #b83227;
  --good-bg: #e3f3ea; --warn-bg: #fbefdc; --bad-bg: #fbe5e3;
  --btn: #14171c; --btn-ink: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1114; --surface: #191c21; --ink: #eceef1; --muted: #9aa2ad; --line: #2b3038; --soft: #20242a;
  --red: #ec5a4f; --blue: #5b8ef0; --yellow: #f0c23a; --green: #4cbc75;
  --good: #5fd08e; --warn: #f0b04a; --bad: #f07a6f;
  --good-bg: #16301f; --warn-bg: #352812; --bad-bg: #3a1a17;
  --btn: #eceef1; --btn-ink: #14171c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #191c21; --ink: #eceef1; --muted: #9aa2ad; --line: #2b3038; --soft: #20242a;
  --red: #ec5a4f; --blue: #5b8ef0; --yellow: #f0c23a; --green: #4cbc75;
  --good: #5fd08e; --warn: #f0b04a; --bad: #f07a6f;
  --good-bg: #16301f; --warn-bg: #352812; --bad-bg: #3a1a17;
  --btn: #eceef1; --btn-ink: #14171c; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--body); padding: 0 16px; padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)) }
.wrap { max-width: 560px; margin: 0 auto }
header.top { padding-top: calc(18px + env(safe-area-inset-top, 0px)) !important; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 6px }
h1, h2, h3 { font-family: var(--display); letter-spacing: .01em; text-wrap: balance; margin: 0 }
h1 { font-size: 30px; font-weight: 700; text-transform: uppercase }
h2 { font-size: 22px; font-weight: 700; text-transform: uppercase }
h3 { font-size: 19px; font-weight: 600 }
.date { color: var(--muted); font-size: 14px }
.num { font-variant-numeric: tabular-nums }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.stack { display: grid; gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px }
.muted { color: var(--muted) }
.small { font-size: 14px }
.banner { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); margin-block: 8px }

/* workout picker */
.picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-block: 10px 14px }
.pick { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 8px 4px; font: 600 15px/1.1 var(--display); text-transform: uppercase; cursor: pointer; display: grid; justify-items: center; gap: 6px }
.pick .plate { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--c); background: transparent }
.pick[aria-pressed="true"] { border-color: var(--c); background: var(--soft) }
.pick[aria-pressed="true"] .plate { background: var(--c) }
.pick small { font: 400 12px var(--body); text-transform: none; color: var(--muted) }

.ex-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px }
.ex-head > div { min-width: 0 }
.target { font-size: 14px; color: var(--muted) }
.last { font-size: 13px; color: var(--muted); margin-top: 2px }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap }
.pill.up { background: var(--good-bg); color: var(--good) }
.pill.hold { background: var(--soft); color: var(--muted) }
.pill.miss { background: var(--warn-bg); color: var(--warn) }
.pill.new { background: var(--soft); color: var(--ink) }
.advice { font-size: 14px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--soft) }
.weightrow { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.stepper button { width: 40px; height: 40px; border: 0; background: var(--soft); color: var(--ink); font-size: 20px; cursor: pointer }
.stepper input { width: 70px; height: 40px; border: 0; text-align: center; font: 700 20px var(--display); background: var(--surface); color: var(--ink) }
.sets { display: grid; gap: 6px; margin-top: 10px }
.set { display: grid; grid-template-columns: 52px 1fr 48px; align-items: center; gap: 8px }
.set input { height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font: 600 18px var(--body); background: var(--surface); color: var(--ink); width: 100%; min-width: 0 }
.set .tick { height: 42px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer }
.set.done .tick { background: var(--good); border-color: var(--good); color: var(--surface) }
.cardio { border-left: 0; display: flex; gap: 10px; align-items: flex-start }
.cardio input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--good) }

button.primary { width: 100%; height: 52px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-ink); font: 700 20px var(--display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer }
button.secondary { height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 15px var(--body); cursor: pointer }
button.link { border: 0; background: none; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 4px }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px }

/* body + money */
.big { font: 700 44px/1 var(--display) }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.tile { background: var(--soft); border-radius: 10px; padding: 10px }
.tile .v { font: 700 26px/1.1 var(--display) }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch }
.form input, .form select { height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font: 600 17px var(--body); background: var(--surface); color: var(--ink); min-width: 0 }
.form input.w { flex: 1 1 120px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { height: 44px; padding: 0 14px; border: 0; background: var(--surface); color: var(--muted); font: 600 15px var(--body); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink) }
.meter { height: 12px; background: var(--soft); border-radius: 6px; position: relative; overflow: hidden; margin-top: 8px }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--good) }
.meter i.over { background: var(--bad) }
.meter i.warn { background: var(--warn) }
.meter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .55 }
ul.log { list-style: none; margin: 0; padding: 0; display: grid }
ul.log li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding-block: 9px; border-top: 1px solid var(--line) }
ul.log li:first-child { border-top: 0 }
ul.log li > span:first-child { min-width: 0 }
.status { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px }
.status.good { background: var(--good-bg); color: var(--good) }
.status.warn { background: var(--warn-bg); color: var(--warn) }
.status.bad { background: var(--bad-bg); color: var(--bad) }
.spark { width: 100%; height: 110px; display: block; margin-top: 8px }
table.plan { width: 100%; border-collapse: collapse; font-size: 15px }
table.plan td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top }
table.plan td:first-child { width: 56px; font-weight: 700 }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px }

/* meals */
.recipe { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line) }
.card h2 + .recipe { border-top: 0; padding-top: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px }
.chips span { font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); font-weight: 600 }
.swap { flex: none }
details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--blue); padding-block: 4px }
ul.ing { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; font-size: 15px }
ul.ing li { display: flex; justify-content: space-between; gap: 10px }
ol.steps { padding-left: 20px; margin: 8px 0; display: grid; gap: 6px; font-size: 15px }
ul.shop { list-style: none; padding: 0; margin: 6px 0 0; display: grid }
ul.shop li { border-top: 1px solid var(--line) }
ul.shop label { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; align-items: start; padding-block: 8px; cursor: pointer }
ul.shop label > span { min-width: 0 }
ul.shop input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--good) }
ul.shop input:checked + span { opacity: .45; text-decoration: line-through }

/* bottom bars */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5 }
nav.tabs button { height: 60px; border: 0; background: none; color: var(--muted); font: 600 14px var(--display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; display: grid; place-items: center; gap: 0; padding-top: 6px }
nav.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2 }
nav.tabs button[aria-current="page"] { color: var(--ink) }
.timer { position: fixed; left: 12px; right: 12px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); max-width: 536px; margin: 0 auto; background: var(--btn); color: var(--btn-ink); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 6; font-weight: 600 }
.timer .t { font: 700 26px var(--display) }
.timer button { background: transparent; color: var(--btn-ink); border: 1px solid currentColor; border-radius: 8px; padding: 6px 10px; font: 600 14px var(--body); cursor: pointer; opacity: .85 }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 7; max-width: calc(100% - 32px); text-align: center }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out } @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px) } } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top"><h1>Plates &amp; Plates</h1><span class="date" id="today"></span></header>
    <main id="main" class="stack"></main>
</div>
<div id="timer" class="timer" hidden><span>Rest <span class="t num" id="tleft">1:30</span></span><span style="display:flex;gap:6px"><button id="tadd">+30s</button><button id="tskip">Done</button></span></div>
<div id="toast" class="toast" hidden></div>
<nav class="tabs" aria-label="Sections">
  <button data-tab="lift"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Lift</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Body</button>
  <button data-tab="meals"><svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3M9 10v11M17 21V3c-2 1.5-3 4-3 7h3"/></svg>Meals</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9.5 10.2c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.7-1.1 1.4-2.5 1.8-2.5.8-2.5 1.8 1.1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/></svg>Food $</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
</nav>

<script>
// ---------- program ----------
const W = {
  LA: { name: "Lower A", c: "var(--red)", day: 1, cardio: "10 min easy cardio: bike or incline walk.", ex: [
    { id: "squat", n: "Back squat", sets: 3, lo: 6, hi: 8, type: "load", inc: 10, rest: 150 },
    { id: "rdl", n: "Romanian deadlift", sets: 3, lo: 8, hi: 10, type: "load", inc: 10, rest: 120 },
    { id: "lunge", n: "Walking lunges", unit: "lb per hand · reps per leg", sets: 2, lo: 10, hi: 12, type: "load", inc: 5, rest: 90 },
    { id: "legcurl", n: "Leg curl", sets: 2, lo: 10, hi: 12, type: "load", inc: 5, rest: 90 },
    { id: "plank", n: "Plank", sets: 3, lo: 30, hi: 45, type: "time", rest: 60 } ] },
  UA: { name: "Upper A", c: "var(--blue)", day: 2, cardio: "20 min steady cardio at a pace where you can still talk.", ex: [
    { id: "bench", n: "Bench press", sets: 3, lo: 6, hi: 8, type: "load", inc: 5, rest: 150 },
    { id: "cablerow", n: "Seated cable row", sets: 3, lo: 8, hi: 10, type: "load", inc: 5, rest: 120 },
    { id: "ohp", n: "Overhead dumbbell press", unit: "lb per hand", sets: 2, lo: 8, hi: 10, type: "load", inc: 5, rest: 120 },
    { id: "pulldown", n: "Lat pulldown", sets: 2, lo: 10, hi: 12, type: "load", inc: 5, rest: 90 },
    { id: "curl", n: "Dumbbell curls", unit: "lb per hand", sets: 2, lo: 10, hi: 12, type: "load", inc: 5, rest: 60 },
    { id: "pushdown", n: "Triceps pushdown", sets: 2, lo: 10, hi: 12, type: "load", inc: 5, rest: 60 } ] },
  LB: { name: "Lower B", c: "var(--yellow)", day: 4, cardio: "10 min easy cardio: bike or incline walk.", ex: [
    { id: "deadlift", n: "Deadlift (trap bar or conventional)", sets: 3, lo: 5, hi: 5, type: "load", inc: 10, rest: 180 },
    { id: "legpress", n: "Leg press", sets: 3, lo: 10, hi: 12, type: "load", inc: 10, rest: 120 },
    { id: "bss", n: "Bulgarian split squat", unit: "lb per hand · reps per leg", sets: 2, lo: 8, hi: 10, type: "load", inc: 5, rest: 90 },
    { id: "calf", n: "Calf raises", sets: 3, lo: 12, hi: 15, type: "load", inc: 10, rest: 60 },
    { id: "kneeraise", n: "Hanging knee raises", sets: 3, lo: 10, hi: 15, type: "reps", rest: 60 } ] },
  UB: { name: "Upper B", c: "var(--green)", day: 5, cardio: "Intervals: 5 min warm-up, then 6–8 rounds of 30s hard / 90s easy on a bike or rower.", ex: [
    { id: "pullup", n: "Pull-ups", unit: "lb of assistance (0 = bodyweight)", sets: 3, lo: 6, hi: 10, type: "assist", inc: 10, rest: 150 },
    { id: "incline", n: "Incline dumbbell press", unit: "lb per hand", sets: 3, lo: 8, hi: 10, type: "load", inc: 5, rest: 120 },
    { id: "dbrow", n: "One-arm dumbbell row", unit: "lb · reps per arm", sets: 3, lo: 10, hi: 12, type: "load", inc: 5, rest: 90 },
    { id: "lateral", n: "Lateral raises", unit: "lb per hand", sets: 3, lo: 12, hi: 15, type: "load", inc: 5, rest: 60 },
    { id: "facepull", n: "Face pulls", sets: 2, lo: 12, hi: 15, type: "load", inc: 5, rest: 60 } ] },
};
const APP_VERSION = "2026.10.11-1";
const ORDER = ["LA", "UA", "LB", "UB"];
const DEFAULTS = { calTarget: 2200, protein: 160, fat: 65, groceryBudget: 350, diningBudget: 400 };

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = s => parseISO(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const money = n => "$" + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

// ---------- data store: shared db when available, this device otherwise ----------
const COLS = ["settings", "lifts", "sessions", "weighins", "spend", "menus"];
const cache = Object.fromEntries(COLS.map(c => [c, {}]));
let db = null, mode = "loading";
const store = {
  async set(col, id, data) {
    cache[col][id] = data; render();
    if (db) { try { await db.collection(col).doc(id).set(data); } catch (e) { toast("Couldn't save. Check your connection and try again."); } }
    else lsSet("pp:" + col, cache[col]);
  },
  async add(col, data) {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return this.set(col, id, data);
  },
  async del(col, id) {
    delete cache[col][id]; render();
    if (db) { try { await db.collection(col).doc(id).delete(); } catch { toast("Couldn't delete. Try again."); } }
    else lsSet("pp:" + col, cache[col]);
  },
};
let pendingRender = false;
function liveRender() {
  const a = document.activeElement;
  if (a && a.matches("main input, main select")) { pendingRender = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !document.activeElement?.matches("main input, main select")) { pendingRender = false; render(); } }, 0));

// This app keeps its data on the phone. On first launch it loads the starting data from the Claude version.
const SEED = {
  settings: { main: { calTarget: 2200, protein: 160, fat: 65, groceryBudget: 350, diningBudget: 400 } },
  weighins: { "2026-10-02": { date: "2026-10-02", weight: 171.2 } },
  lifts: { bench: { weight: 115, oneRepMax: 160 }, squat: { weight: 125, oneRepMax: 180 }, deadlift: { weight: 155 }, rdl: { weight: 115 },
    lunge: { weight: 20 }, legcurl: { weight: 50 }, cablerow: { weight: 70 }, ohp: { weight: 20 }, pulldown: { weight: 70 }, curl: { weight: 15 },
    pushdown: { weight: 30 }, legpress: { weight: 140 }, bss: { weight: 15 }, calf: { weight: 90 }, pullup: { weight: 50 }, incline: { weight: 30 },
    dbrow: { weight: 35 }, lateral: { weight: 10 }, facepull: { weight: 25 } },
};
mode = "local";
if (!lsGet("pp:seeded", false)) {
  for (const col of COLS) if (SEED[col] && !Object.keys(lsGet("pp:" + col, {})).length) lsSet("pp:" + col, SEED[col]);
  lsSet("pp:seeded", true);
}
for (const col of COLS) cache[col] = lsGet("pp:" + col, {});
try { navigator.storage?.persist?.(); } catch {}

const settings = () => ({ ...DEFAULTS, ...(cache.settings.main || {}) });

// ---------- progression ----------
function advise(e, L) {
  if (!L || !L.lastReps?.length) {
    if (e.type === "time") return { pill: "new", label: "First time", text: `Hold each set ${e.lo}–${e.hi} seconds.` };
    if (e.type === "reps") return { pill: "new", label: "First time", text: `Aim for ${e.lo}–${e.hi} controlled reps.` };
    if (L?.weight != null) return { pill: "new", label: "Starting weight", text: `Start at ${L.weight} lb. If the first set leaves 4+ reps in the tank, go up for the next set. If you can't reach ${e.lo} reps, go down.` };
    if (e.type === "assist") return { pill: "new", label: "First time", text: "Pick an assistance level that lets you get 6 clean reps." };
    return { pill: "new", label: "First time", text: "Pick a weight you could lift 2–3 more reps with than the target. Learn the movement first." };
  }
  const full = L.lastReps.length >= e.sets && L.lastReps.every(r => r >= e.hi);
  const missed = L.lastReps.some(r => r < e.lo);
  if (e.type === "time") return full ? { pill: "up", label: "+5 sec", text: `You held ${e.hi}s on every set. Add 5 seconds or a harder variation.` } : { pill: "hold", label: "Hold", text: `Build to ${e.hi}s on every set.` };
  if (e.type === "reps") return full ? { pill: "up", label: "Harder", text: `You hit ${e.hi} on every set. Slow the lowering to 3 seconds or raise straight legs.` } : { pill: "hold", label: "Add reps", text: `Work toward ${e.hi} reps on every set.` };
  if (full) {
    if (e.type === "assist") return L.weight > 0
      ? { pill: "up", label: `−${e.inc} lb assist`, text: `You hit ${e.sets}×${e.hi}. Use ${e.inc} lb less assistance.` }
      : { pill: "up", label: "Add weight", text: `${e.sets}×${e.hi} at bodyweight. Add 5–10 lb with a belt or dumbbell.` };
    return { pill: "up", label: `+${e.inc} lb`, text: `You hit ${e.sets}×${e.hi} last time. Go up to ${L.weight + e.inc} lb.` };
  }
  if (missed) return { pill: "miss", label: "Repeat", text: `A set fell under ${e.lo} reps. Stay at ${L.weight} lb and own it. Miss twice in a row? Drop 10%.` };
  return { pill: "hold", label: "Same weight", text: `Stay at ${L.weight} lb and add a rep where you can. Go up when every set hits ${e.hi}.` };
}
function nextWeight(e, L) {
  if (!L || L.weight == null) return "";
  const full = L.lastReps?.length >= e.sets && L.lastReps.every(r => r >= e.hi);
  if (!full) return L.weight;
  if (e.type === "load") return L.weight + e.inc;
  if (e.type === "assist") return Math.max(0, L.weight - e.inc);
  return L.weight;
}

function finishWorkout() {
  const k = state.workout, w = W[k], d = getDraft(k);
  const out = {}; let ups = 0, logged = 0;
  for (const e of w.ex) {
    const reps = (d.r[e.id] || []).map(Number).filter(n => n > 0);
    if (!reps.length) continue;
    logged++;
    const wt = e.type === "load" || e.type === "assist" ? Number(d.w[e.id] ?? nextWeight(e, cache.lifts[e.id])) || 0 : null;
    out[e.id] = { weight: wt, reps };
    const rec = { weight: wt, lastReps: reps, lastDate: iso() };
    if (reps.length >= e.sets && reps.every(r => r >= e.hi)) ups++;
    store.set("lifts", e.id, rec);
  }
  if (!logged) { toast("Log reps for at least one set first."); return; }
  store.set("sessions", `${iso()}_${k}`, { date: iso(), workout: k, sets: out, cardio: !!d.cardio, savedAt: new Date().toISOString() });
  toast(ups ? `Workout saved. ${ups} lift${ups > 1 ? "s go" : " goes"} up next time.` : "Workout saved.");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---------- body tab ----------
function weekAvgs() {
  const ws = Object.values(cache.weighins).filter(x => x.weight > 0);
  const now = parseISO(iso());
  const bucket = i => {
    const xs = ws.filter(x => { const age = Math.round((now - parseISO(x.date)) / 864e5); return age >= i * 7 && age < (i + 1) * 7; });
    return xs.length ? xs.reduce((s, x) => s + x.weight, 0) / xs.length : null;
  };
  return [bucket(0), bucket(1), bucket(2)];
}
function calorieAdvice() {
  const [w0, w1, w2] = weekAvgs();
  if (w0 == null || w1 == null) return { cls: "warn", head: "Keep logging", text: "Weigh in a few mornings a week. You'll get a recommendation once there are two weeks of data.", delta: 0 };
  const d1 = w0 - w1, d2 = w2 != null ? w1 - w2 : null;
  const rate = `${d1 <= 0 ? "Down" : "Up"} ${Math.abs(d1).toFixed(1)} lb vs last week.`;
  if (d1 < -1.5) return { cls: "warn", head: "Losing too fast", text: `${rate} Add about 150 kcal a day so you keep your strength.`, delta: 150 };
  if (d1 > -0.25 && d2 != null && d2 > -0.25) return { cls: "bad", head: "Stalled 2+ weeks", text: `${rate} Cut about 150 kcal a day, from carbs or fat (never protein). If your waist is shrinking and lifts are going up, it's working; don't change anything.`, delta: -150 };
  if (d1 > -0.25) return { cls: "warn", head: "Flat this week", text: `${rate} Give it one more week before changing anything.`, delta: 0 };
  return { cls: "good", head: "On track", text: `${rate} Target is 0.5–1 lb a week. Keep going.`, delta: 0 };
}
function spark(ws) {
  if (ws.length < 2) return "";
  const W_ = 320, H_ = 110, p = 22;
  const vs = ws.map(x => x.weight), lo = Math.floor(Math.min(...vs) - 1), hi = Math.ceil(Math.max(...vs) + 1);
  const t0 = parseISO(ws[0].date), t1 = parseISO(ws[ws.length - 1].date), span = Math.max(1, t1 - t0);
  const X = d => p + (parseISO(d) - t0) / span * (W_ - p * 2), Y = v => 8 + (hi - v) / (hi - lo) * (H_ - 30);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.weight).toFixed(1)}`).join(" ");
  const last = ws[ws.length - 1];
  return `<svg class="spark" viewBox="0 0 ${W_} ${H_}" role="img" aria-label="Weight trend">
    <line x1="${p}" x2="${W_ - p}" y1="${Y(hi)}" y2="${Y(hi)}" stroke="var(--line)"/><line x1="${p}" x2="${W_ - p}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    <text x="0" y="${Y(hi) + 4}" font-size="10" fill="var(--muted)">${hi}</text><text x="0" y="${Y(lo) + 4}" font-size="10" fill="var(--muted)">${lo}</text>
    <polygon points="${X(ws[0].date)},${Y(lo)} ${pts} ${X(last.date)},${Y(lo)}" fill="var(--blue)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(last.date)}" cy="${Y(last.weight)}" r="4.5" fill="var(--blue)"/>
    <text x="${p}" y="${H_ - 4}" font-size="10" fill="var(--muted)">${fmtDay(ws[0].date)}</text><text x="${W_ - p}" y="${H_ - 4}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtDay(last.date)}</text></svg>`;
}

function renderFood() {

  const sum = k => items.filter(x => x.kind === k).reduce((t, x) => t + x.amount, 0);
  const meter = (label, spent, budget) => {
    const pct = spent / budget, exp = budget * pace, left = budget - spent;
    const cls = spent > budget ? "over" : spent > exp * 1.1 ? "warn" : "";
    const st = spent > budget ? ["bad", "Over budget"] : spent > exp * 1.1 ? ["warn", "Ahead of pace"] : ["good", "On pace"];

function macros(r) {

}

function fmtQty(q, unit) {
  if (unit === "g") return `${Math.round(q / 5) * 5} g`;

}

  FIXED.forEach(([k, q]) => addQ(k, q));
  const rows = Object.entries(need).map(([k, q]) => { const i = ING[k]; return { k, name: i[0], unit: i[1], q, cost: i[2] * q, buy: i[7] ? 0 : Math.max(1, Math.ceil(q / i[5] - .1)), pkg: i[6], staple: i[7], aisle: i[8] }; });

async function saveBackup() {
  const data = { app: "plates-and-plates", version: APP_VERSION, savedAt: new Date().toISOString(), ...Object.fromEntries(COLS.map(c => [c, cache[c]])) };
  const file = new File([JSON.stringify(data, null, 1)], `plates-backup-${iso()}.json`, { type: "application/json" });
  try {
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: "Plates & Plates backup" });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    lsSet("pp:lastBackup", iso()); render(); toast("Backup saved.");
  } catch (e) { if (e?.name !== "AbortError") toast("Couldn't save the backup. Try again."); }
}
async function restoreBackup(f) {
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "plates-and-plates") throw new Error("not a backup");
    for (const c of COLS) { cache[c] = d[c] || {}; lsSet("pp:" + c, cache[c]); }
    render(); toast(`Restored backup from ${fmtDay(d.savedAt.slice(0, 10))}.`);
  } catch { toast("That file isn't a Plates & Plates backup."); }
}

      const busy = Object.keys(lsGet(draftKey(state.workout || "LA"), { r: {} }).r || {}).length && state.tab === "lift";
      if (busy) { toast("App update ready. It installs next time you open the app."); return; }
      const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update();
      location.reload();
    }
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - lastCheck > 60000) { lastCheck = Date.now(); checkForUpdate(); } });
setTimeout(checkForUpdate, 3000);
</script>
